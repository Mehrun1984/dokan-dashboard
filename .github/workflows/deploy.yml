name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/deploy/dokan-dashboard
            git pull origin master
            npm ci
            npm run build
            pm2 reload vendor-pwa --update-env
            pm2 logs vendor-pwa --lines 30 --nostream